{% extends 'club/admin_panel.html' %}
{% block content %}

<title>Access Denied</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>

<div class="container">
    <h2>Access Denied</h2>
    <p>You do not have permission to access this page.</p>

    {% if user.is_authenticated %}
        <a href="{% url 'home' %}" class="btn">Go to Homepage</a>
    {% else %}
        <a href="{% url 'admin_login' %}" class="btn">Back to Login</a>
    {% endif %}
</div>
{% endblock %}
