{% load static %}

<style>
  /* SHINY & GLASSMORPHIC NAVBAR CONTAINER */
  .custom-navbar {
    margin-bottom: auto;
    padding: 0.4rem 1.5rem !important; /* Tighter padding drastically reduces height */
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(240, 244, 248, 0.85)) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    transition: all 0.3s ease;
  }

  /* REFINED LOGO SCALING */
  .navbar-logo {
    height: 80px; /* Reduced from 120px to perfectly sit inside a slim navbar */
    width: auto;
    object-fit: contain;
    transition: transform 0.2s ease;
  }
  .navbar-logo:hover {
    transform: scale(1.03);
  }

  /* PROFESSIONAL TYPOGRAPHY & HOVER ANIMATIONS */
  .custom-navbar .nav-link {
    color: #3a4750 !important;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.5rem 0.8rem !important;
    position: relative;
    transition: color 0.25s ease;
  }

  .custom-navbar .nav-link:hover {
    color: #0052cc !important; /* Elegant corporate blue shimmer */
  }

  /* Subtle underline reveal on link hover */
  .custom-navbar .nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 2px;
    left: 8px;
    background-color: #0052cc;
    transition: width 0.2s ease;
  }
  .custom-navbar .nav-link:hover::after {
    width: calc(100% - 16px);
  }

  /* CRISP COMPACT INPUTS */
  .custom-navbar .form-control {
    font-size: 0.85rem;
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    border: 1px solid #ced4da;
    background: rgba(255, 255, 255, 0.7);
  }

  .custom-navbar .btn-search {
    font-size: 0.85rem;
    padding: 0.375rem 0.9rem;
    border-radius: 6px;
    font-weight: 500;
    border: 1px solid #0052cc;
    color: #0052cc;
    background: transparent;
    transition: all 0.2s ease;
  }
  .custom-navbar .btn-search:hover {
    background: #0052cc;
    color: #ffffff;
    box-shadow: 0 0 8px rgba(0, 82, 204, 0.3);
  }
</style>

<nav class="navbar navbar-expand-lg navbar-light custom-navbar fixed-top">
  <div class="container-fluid">
    <!-- BRAND / LOGO -->
    <a class="navbar-brand py-0 d-flex align-items-center" href="#">
      <img src="{% static 'image/logo.png' %}" alt="Logo" class="navbar-logo">
    </a>
    
    <!-- MOBILE RESPONSIVE HAMBURGER BUTTON -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAVIGATION LINKS -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Clubhouse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">About</a>
        </li> 
        <!-- <li class="nav-item">
          <a class="nav-link" href="{% url 'books' %}">Bookshop</a>
        </li> -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="{% url 'careers' %}" id="careersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Careers</a>
          <ul class="dropdown-menu" aria-labelledby="careersDropdown">
            <li><a class="dropdown-item" href="{% url 'digitalentrepreneurship' %}">Digital Entrepreneurs</a></li>
          </ul>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{% url 'characterbuilding' %}">Character Building</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="{% url 'financeliteracy' %}" id="financeliteracyDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Finance Literacy</a>
          <ul class="dropdown-menu" aria-labelledby="financeliteracyDropdown">
            <li><a class="dropdown-item" href="{% url 'investment' %}">Investment</a></li>
            <li><a class="dropdown-item" href="{% url 'savings' %}">Savings</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">Find Us</a>
        </li>
      </ul>

      <!-- UTILITY SEARCH BAR -->
      <form class="d-flex align-items-center ms-lg-2">
        <input class="form-control me-2" type="search" placeholder="Search..." aria-label="Search">
        <button class="btn btn-search" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
