{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- OPEN GRAPH META TAGS -->
    {% block og_meta %}
    {% if post %}
        <meta property="og:title" content="{{ post.title|default:'Social Feed Post' }}" />
        <meta property="og:description" content="{{ post.content|truncatewords:30 }}" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}" />
        {% if post.image %}
            <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ post.image.url }}" />
        {% else %}
            <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'image/logo.png' %}" />
        {% endif %}
    {% else %}
        <meta property="og:title" content="Smartkids Africa - School Login Portal" />
        <meta property="og:description" content="Access your personalized learning dashboard, assignments, and school resources on Smartkids Africa." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}" />
        <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'image/logo.png' %}" />
    {% endif %}
    {% endblock %}

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'image/favicon.png' %}">

    <title>Smartkids Africa</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .partners-wrapper {
            margin-top: 20px !important;
            padding-top: 2px !important;
            padding-bottom: 2px !important;
        }

        .partners-title {
            margin-top: 0 !important;
            margin-bottom: 8px !important;
            padding: 0 !important;
            color: navy;
            line-height: 1.2;
        }

        .partners-slider {
            width: 100%;
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
        }

        main.custom-container {
            margin-top: 0 !important;
            margin-bottom: 1%;
            padding-top: 0 !important;
            padding-bottom: 1 !important;
        }

        @media (max-width: 991px) {
            .partners-wrapper {
                margin-top: 76px !important;
                padding-top: 2px !important;
            }
        }

        @media (max-width: 580px) {
            .partners-wrapper {
                margin-top: 70px !important;
                padding-top: 2px !important;
                padding-bottom: 6px !important;
            }

            .partners-title {
                font-size: 1.05rem;
                margin-bottom: 6px !important;
            }
        }
    </style>

</head>

<body class="theme-light">

    <!-- NAVBAR -->
    {% include 'club/navbar.html' %}

    <!-- TRUSTED PARTNERS -->
    <section class="partners-wrapper">
        <div class="container custom-container">
            <h4 class="text-center fw-bold partners-title">Our Trusted Brands</h4>
            <div class="partners-slider">
                <div class="partners-track">
                    <img src="{% static 'image/smarttech_logo.png' %}" alt="SmartTech" width="50" height="50">
                    <img src="{% static 'image/teenafrique_logo.png' %}" alt="Teen Afrique">
                    <img src="{% static 'image/stencil_book.png' %}" alt="Stencil Book">
                    <img src="{% static 'image/smarttech_logo.png' %}" alt="SmartTech">
                    <img src="{% static 'image/teenafrique_logo.png' %}" alt="Teen Afrique">
                    <img src="{% static 'image/stencil_book.png' %}" alt="Stencil Book">
                </div>
            </div>
        </div>
    </section>

    <!-- PAGE CONTENT -->
    <main class="container custom-container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    {% include 'club/footer.html' %}

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
