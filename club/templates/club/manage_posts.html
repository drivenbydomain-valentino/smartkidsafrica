{% extends 'club/admin_panel.html' %}
{% load static %}

{% block content %}

<style>
    .dashboard-header {
        background: linear-gradient(135deg, #4f46e5, #ec4899);
        color: white;
        padding: 30px;
        border-radius: 15px;
    }

    .info-card {
        border: none;
        border-radius: 15px;
        transition: all 0.25s ease-in-out;
        overflow: hidden;
    }

    .info-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(79, 70, 229, 0.2);
    }

    .card-accent {
        height: 5px;
        background: linear-gradient(90deg, #4f46e5, #ec4899);
    }

    .post-author {
        font-weight: 600;
        color: #111827;
    }

    .post-content {
        color: #374151;
        margin: 10px 0;
    }

    .delete-btn {
        background: linear-gradient(135deg, #ef4444, #ec4899);
        border: none;
        color: white;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        text-decoration: none;
    }

    .delete-btn:hover {
        opacity: 0.9;
        color: white;
    }
</style>

<div class="container py-5">

    <!-- Header -->
    <div class="dashboard-header mb-4">
        <h2 class="fw-bold mb-1">Manage Posts 📝</h2>
        <p class="mb-0">View and control all user posts</p>
    </div>

    <!-- Posts List -->
    <div class="row g-4">

        {% for post in posts %}
        <div class="col-md-6 col-lg-4">
            <div class="card info-card shadow-sm h-100">
                <div class="card-accent"></div>

                <div class="card-body d-flex flex-column justify-content-between">

                    <div>
                        <div class="post-author">{{ post.author.username }}</div>
                        <div class="post-content">{{ post.content }}</div>
                    </div>

                    <div class="mt-3 text-end">
                        <a href="{% url 'delete_post' post.id %}" class="delete-btn">
                            Delete
                        </a>
                    </div>

                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="card info-card shadow-sm">
                <div class="card-accent"></div>
                <div class="card-body text-center text-muted py-4">
                    No posts available.
                </div>
            </div>
        </div>
        {% endfor %}

    </div>

</div>

{% endblock %}
