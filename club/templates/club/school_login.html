{% extends "club/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card my-4 shadow-lg border-0 rounded-4" style="background-color: #fffdf5;">
        <div class="card-body p-4 p-lg-5">
          <form method="POST" action="{% url 'club:school_login' %}">
            {% csrf_token %}

            <div class="text-center mb-4">
              <img src="{% static 'image/logo.png' %}" alt="School Portal Logo" class="img-fluid rounded-circle shadow-sm" width="120" height="120">
            </div>

            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2" style="color: #123c8c;">
                <i class="bi bi-building me-2"></i>School Portal Login
              </h2>
              <p class="text-muted mb-0">Welcome back! Login to access your school administrative account.</p>
            </div>

            <div class="mb-4">
              <label for="username" class="form-label fw-semibold" style="color: #123c8c;">
                <i class="bi bi-house-door-fill me-1"></i> School Name / Username
              </label>
              <input type="text" id="username" name="username" class="form-control form-control-lg rounded-3" placeholder="Enter school name" value="{{ username|default:'' }}" autocomplete="username" required>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold" style="color: #123c8c;">
                <i class="bi bi-lock-fill me-1"></i> Password
              </label>
              <div class="input-group">
                <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Enter password" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary bg-white" type="button" id="togglePassword" aria-label="Show or hide password">
                  <i class="bi bi-eye-slash" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" name="action_login" class="btn btn-lg fw-bold rounded-3 text-white" style="background-color: #123c8c;">
                <i class="bi bi-box-arrow-in-right me-2"></i> Login to School Portal
              </button>
            </div>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-2 text-muted small">Don't have a registered school account yet?</p>
            <a href="{% url 'club:schoolregister' %}" class="btn btn-outline-primary btn-lg fw-bold w-100 rounded-3" style="color: #123c8c; border-color: #123c8c;">
              <i class="bi bi-building-add me-2"></i> Register Your School
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const toggleIcon = document.getElementById("toggleIcon");

    if (togglePassword && passwordInput && toggleIcon) {
      togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove("bi-eye-slash");
          toggleIcon.classList.add("bi-eye");
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove("bi-eye");
          toggleIcon.classList.add("bi-eye-slash");
        }
      });
    }
  });
</script>
{% endblock %}
